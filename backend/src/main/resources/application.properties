
# Application
spring.application.name=doomscroll-backend

# Server
server.port=8080
server.address=0.0.0.0

# MongoDB
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/doomscroll?uuidRepresentation=standard}
spring.mongodb.representation.uuid=standard
spring.data.mongodb.auto-index-creation=true

# Admin initialization
admin.init.username=${ADMIN_INIT_USERNAME:}
admin.init.password=${ADMIN_INIT_PASSWORD:}


# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

# Spring Session Redis
spring.session.data.redis.namespace=doomscroll:sessions
server.servlet.session.timeout=30m

# Cookies
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
