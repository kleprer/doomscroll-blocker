
services:
  mongodb:
    image: mongo:8.0
    container_name: doomscroll-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: doomscroll
      MONGO_INITDB_ROOT_PASSWORD: doomscroll
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --username doomscroll --password doomscroll --authenticationDatabase admin --eval "db.adminCommand('ping').ok" | grep 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doomscroll-backend
    restart: unless-stopped
    environment:
      SPRING_MONGODB_URI: mongodb://doomscroll:doomscroll@mongodb:27017/doomscroll?authSource=admin&uuidRepresentation=standard
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      ADMIN_INIT_USERNAME: ${ADMIN_INIT_USERNAME:-}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:-}
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doomscroll-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - /app/node_modules

  redis:
    image: redis:7.4-alpine
    container_name: doomscroll-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mongo_data:
  redis_data:
