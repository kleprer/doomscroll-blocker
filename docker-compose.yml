services:
  postgres:
    image: postgres:16-alpine
    container_name: doomscroll-db
    environment:
      POSTGRES_DB: doomscroll
      POSTGRES_USER: doomscroll
      POSTGRES_PASSWORD: doomscroll
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doomscroll"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doomscroll-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/doomscroll
      SPRING_DATASOURCE_USERNAME: doomscroll
      SPRING_DATASOURCE_PASSWORD: doomscroll
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doomscroll-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - /app/node_modules

volumes:
  postgres_data: